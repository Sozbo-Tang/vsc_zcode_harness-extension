[project]
name = "zcode-py"
version = "0.1.0"
description = "Zcode-Py agent core: hand-rolled Python agent harness driven by the VSCode sidebar extension over stdio JSONL"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "openai",
    "httpx",
    # M8（R31）：notebook 元数据读写（read/write 工具必装，轻量）；
    # 执行用的 nbclient 在下方 [notebook] 可选组
    "nbformat",
]

[dependency-groups]
dev = [
    "pytest",
]
# M6（R8）浏览器自动化可选组：browser-use 未安装时 tools/browser.py 的
# 注册函数返回 False、两个浏览器工具不进注册表（服务侧对幻觉调用返回
# 结构化安装指引）。uv 用法：
#   安装：uv sync --project agent --group browser
#   运行/测试（带浏览器）：uv run --project agent --group browser pytest -q
browser = [
    "browser-use",
]
# M8（R31）Notebook 执行可选组：nbclient 未安装时 notebook_run 返回结构化
# 安装指引（tools/notebook.py 的 NBCLIENT_GUIDE）。uv 用法：
#   安装：uv sync --project agent --group notebook
notebook = [
    "nbclient",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
